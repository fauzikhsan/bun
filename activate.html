<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 · Tap pin baru</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">

  <div class="topbar">
    <span class="brand">[nama produk]</span>
    <span class="chip chip--sun">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
      Pin Matahari
    </span>
  </div>

  <section class="grow stack" style="justify-content:center; gap:28px; position:relative">
    <span class="deco heart beat" style="width:30px; top:6px; left:6px; transform:rotate(-14deg)"></span>
    <span class="deco heart" style="width:20px; top:60px; right:14px; transform:rotate(12deg)"></span>
    <span class="deco heart" style="width:16px; top:250px; left:20px; transform:rotate(-8deg)"></span>

    <div style="position:relative; height:260px">
      <div class="blob blob--sun" style="--s:170px; position:absolute; left:0; top:0">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
      </div>
      <div class="blob blob--b blob--sky" style="--s:170px; position:absolute; right:0; bottom:0">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </div>
      <div class="heart-badge" style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:68px; height:68px">
        <span class="heart beat" style="width:32px"></span>
      </div>
    </div>

    <div class="stack" style="gap:12px; text-align:center; align-items:center">
      <h1 class="title">Pin baru nih!<br>Belum punya cerita</h1>
      <p class="sub" style="max-width:320px">Aktifkan sekarang, supaya tiap kali kamu dan pasanganmu tap pin ke HP, yang terbuka adalah ruang kalian berdua.</p>
      <span class="chip">ID pin · 04 8F 4F AE 66 26 81</span>
    </div>
  </section>

  <div class="btn-stack">
    <a class="btn" href="register.html">Aktifkan pin ini</a>
    <a class="btn btn--white" href="register.html">Sudah punya akun? Masuk</a>
  </div>

</main>
</body>
</html>
