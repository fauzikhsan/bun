<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6 · Kartu publik</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">

  <div class="topbar">
    <span class="brand">[nama produk]</span>
    <span class="chip">Tampilan publik</span>
  </div>

  <section class="grow stack" style="justify-content:center; position:relative">
    <span class="deco heart beat" style="width:30px; top:10px; left:8px; transform:rotate(-14deg)"></span>
    <span class="deco heart" style="width:20px; bottom:30px; right:10px; transform:rotate(12deg)"></span>

    <div class="card card--sun stack" style="align-items:center; text-align:center; gap:18px; padding:28px 20px; box-shadow:var(--sh-lg)">
      <div class="pair">
        <div class="blob blob--sun" style="--s:84px; background:var(--white)">R</div>
        <div class="heart-badge"><span class="heart beat"></span></div>
        <div class="blob blob--b blob--sky" style="--s:84px">N</div>
      </div>
      <div class="stack" style="gap:4px">
        <h1 class="title" style="font-size:30px">Raka &amp; Nara</h1>
        <p style="font-weight:600">Bersama sejak 15 September 2025</p>
      </div>
      <div class="row" style="background:var(--white); border:var(--bd); border-radius:16px; padding:12px 14px; text-align:left; align-items:flex-start">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <span style="font-size:14px; font-weight:600">Kenangan, foto, dan lokasi mereka hanya bisa dilihat oleh pemilik pin.</span>
      </div>
    </div>
  </section>

  <div class="btn-stack">
    <a class="btn" href="activate.html">Masuk sebagai pemilik</a>
    <a class="btn btn--white" href="activate.html">Aku menemukan pin ini</a>
    <p class="small center">Pesanmu diteruskan ke pemilik tanpa menampilkan nomor HP mereka.</p>
  </div>

</main>
</body>
</html>
